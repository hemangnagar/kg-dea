# Local run of the published image: docker compose up --build, then open http://127.0.0.1:8000
services:
  inteldoc:
    build: .
    image: inteldoc:1.0
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      INTELDOC_PASSWORD: ${INTELDOC_PASSWORD:-}   # set to enable the login page; empty = open
    restart: unless-stopped
