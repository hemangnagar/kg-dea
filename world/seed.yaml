# ---------------------------------------------------------------------------
# Organizations. Six factions: five founded 2010-2011 and one 2018 split-off.
# ---------------------------------------------------------------------------
organizations:
- id: org-01
  name: Bruma del Cobre
  nickname: los Brumas
  base: manzanillo
  founded: '2010-03-14'
  founding: {type: new, event: beat-01}
  profile: >-
    Pacific port network built by a former Manzanillo customs broker. Imports
    precursor chemicals through Manzanillo, moves product north along Highway 15
    and crosses at Nogales and San Luis Río Colorado. Launders through trucking,
    produce export and a Guadalajara currency exchange.
  leadership:
  - {person: p-anzures-r, from: '2010-03-14', to: '2014-08-02'}
  - {person: p-olivares-d, from: '2014-08-02', to: '2020-02-27'}
  - {person: p-anzures-y, from: '2020-02-27', to: '2027-01-01', secret_only: true}
  fractures:
  - {date: '2017-02-20', event: beat-19, departing_leader: p-loera-f, destination_org: org-05}
  alliances:
  - {with: org-04, from: '2013-06-11', to: '2019-09-30', formed_event: beat-08, broken_event: beat-26}
- id: org-02
  name: Pacto del Faro Gris
  nickname: los Faros
  base: veracruz
  founded: '2011-01-22'
  founding: {type: new, event: beat-05}
  profile: >-
    Gulf coast pact of three port crews under a single boss. Controls the
    Veracruz and Tuxpan docks and the Highway 180 route to Tamaulipas. Shares
    and then fights over Reynosa and Matamoros with Círculo del Valle Quieto.
  leadership:
  - {person: p-trevino-i, from: '2011-01-22', to: '2016-03-09'}
  - {person: p-mijares-l, from: '2016-03-09', to: '2023-11-14'}
  - {person: p-barcenas-u, from: '2023-11-14', to: '2027-01-01', secret_only: true}
  fractures:
  - {date: '2017-08-25', event: beat-20, departing_leader: p-sarabia-b, destination_org: org-03}
  alliances:
  - {with: org-03, from: '2012-10-03', to: '2015-07-14', formed_event: beat-07, broken_event: beat-14}
  - {with: org-05, from: '2014-02-14', to: '2016-04-20', formed_event: beat-10, broken_event: beat-16}
- id: org-03
  name: Círculo del Valle Quieto
  nickname: el Círculo
  base: monterrey
  founded: '2010-09-01'
  founding: {type: new, event: beat-03}
  profile: >-
    Northeastern trucking network run from Monterrey. Owns the Nuevo Laredo and
    Piedras Negras crossings through corrupt customs staff and a fleet of
    tractor-trailers, and takes Reynosa from Pacto del Faro Gris in 2015.
  leadership:
  - {person: p-castanon-a, from: '2010-09-01', to: '2019-05-23'}
  - {person: p-vidaurri-m, from: '2019-05-23', to: '2027-01-01'}
  fractures:
  - {date: '2020-01-10', event: beat-27, departing_leader: p-pedraza-j, destination_org: org-02}
  alliances:
  - {with: org-02, from: '2012-10-03', to: '2015-07-14', formed_event: beat-07, broken_event: beat-14}
  - {with: org-06, from: '2020-05-15', to: '2024-03-08', formed_event: beat-29, broken_event: beat-37}
- id: org-04
  name: Red del Horizonte Azul
  nickname: los Azules
  base: tijuana
  founded: '2010-05-30'
  founding: {type: new, event: beat-02}
  profile: >-
    Baja California crossing network. Runs tunnels at Otay Mesa, pangas from
    Ensenada to San Diego and vehicle loads through Tijuana, Tecate and Mexicali.
    Allied with Bruma del Cobre over Sonora until a dispute over Nogales.
  leadership:
  - {person: p-ferreira-g, from: '2010-05-30', to: '2014-11-20'}
  - {person: p-lizarraga-t, from: '2014-11-20', to: '2027-01-01'}
  fractures:
  - {date: '2022-08-16', event: beat-34, departing_leader: p-sandoval-i, destination_org: org-01}
  alliances:
  - {with: org-01, from: '2013-06-11', to: '2019-09-30', formed_event: beat-08, broken_event: beat-26}
- id: org-05
  name: Liga del Cedro Lunar
  nickname: la Liga
  base: guadalajara
  founded: '2010-11-18'
  founding: {type: new, event: beat-04}
  profile: >-
    Highland synthetic-drug producer based in Guadalajara with laboratories in
    the Tierra Caliente of Michoacán. Takes the Lázaro Cárdenas port in 2012,
    loses its founder to arrest in 2018 and splits that summer.
  leadership:
  - {person: p-montemayor-e, from: '2010-11-18', to: '2018-04-26'}
  - {person: p-ruvalcaba-r, from: '2018-04-26', to: '2027-01-01'}
  fractures:
  - {date: '2018-06-30', event: beat-23, departing_leader: p-loera-f, destination_org: org-06}
  alliances:
  - {with: org-02, from: '2014-02-14', to: '2016-04-20', formed_event: beat-10, broken_event: beat-16}
- id: org-06
  name: Los del Cedro Partido
  nickname: los Partidos
  base: apatzingan
  founded: '2018-06-30'
  founding: {type: split, split_from: org-05, event: beat-23}
  profile: >-
    Faction that broke away from Liga del Cedro Lunar after the founder's
    arrest. Holds Apatzingán, Uruapan and the Lázaro Cárdenas docks, and allies
    with Círculo del Valle Quieto to reach the Texas border through Ojinaga.
  leadership:
  - {person: p-loera-f, from: '2018-06-30', to: '2027-01-01'}
  fractures:
  - {date: '2025-10-02', event: beat-41, departing_leader: p-ledezma-c, destination_org: org-05}
  alliances:
  - {with: org-03, from: '2020-05-15', to: '2024-03-08', formed_event: beat-29, broken_event: beat-37}

