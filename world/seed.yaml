  corridor: cor-tampico-port
  description: >-
    Benito Sarabia Olguín took the Tampico dock crew out of Pacto del Faro
    Gris and placed it under Círculo del Valle Quieto, which gained the Tampico
    and Matamoros plazas without a fight.
  participants:
  - {id: p-sarabia-b, role: departing-leader}
  - {id: p-mijares-l, role: reported-participant}
