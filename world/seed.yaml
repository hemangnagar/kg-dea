  organization: org-03
  corridor: cor-nuevo-laredo
  quantity: {value: 870, unit: kg, commodity: cocaine}
  description: >-
    Inspectors at the Laredo port of entry found 870 kg of cocaine inside
    Tráiler Sierra Madre Doce, a tractor-trailer registered to Autotransportes
    Sierra Madre Norte, during Operation Cauce Seco.
  participants:
  - {id: p-elizondo-f, role: reported-participant}
