  person, nickname, company, vessel, registration, source and operation name is
  invented. Only the geography is real. Intervals are half-open [from, to).
  The sentinel 2027-01-01 means "still current at the end of the corpus".
  Editorial review is pending; automated integrity checks are not approval.

