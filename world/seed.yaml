# ---------------------------------------------------------------------------
# Timeline beats. Roles map to edges: reported-participant -> participated_in,
# organization/counterparty -> linked_to, arrested -> arrested_in,
# victim -> killed_in, extradited -> extradited_in, released -> released_in,
# incoming-official -> elected_in, outgoing-official -> removed_in,
# payee -> paid_in, designated -> designated_in, company -> supported,
# asset -> involved_in.
# ---------------------------------------------------------------------------
timeline:
- id: beat-01
  type: Founding
  name: Founding of Bruma del Cobre
  date: '2010-03-14'
  place: manzanillo
  organization: org-01
  corridor: cor-manzanillo-port
  description: >-
    Rogelio Anzures Tapia, a former customs broker known on the docks as
    El Portuario, consolidated three Manzanillo stevedore crews into a single
    network that bought container slots for precursor chemicals.
  participants:
  - {id: p-anzures-r, role: reported-participant}
  - {id: p-tinoco-g, role: reported-participant}
  - {id: p-lira-a, role: reported-participant}
  - {id: org-01, role: organization}
- id: beat-02
  type: Founding
  name: Founding of Red del Horizonte Azul
  date: '2010-05-30'
  place: tijuana
  organization: org-04
  corridor: cor-tijuana
  description: >-
    Gonzalo Ferreira Luján, a former fishing fleet owner called El Timonel,
    organized tunnel diggers and panga crews in Tijuana and Ensenada into one
    crossing service that charged other groups per load.
  participants:
  - {id: p-ferreira-g, role: reported-participant}
  - {id: p-lizarraga-t, role: reported-participant}
  - {id: p-alcazar-r, role: reported-participant}
  - {id: org-04, role: organization}
- id: beat-03
  type: Founding
  name: Founding of Círculo del Valle Quieto
  date: '2010-09-01'
  place: monterrey
  organization: org-03
  corridor: cor-highway-85
  description: >-
    Aurelio Castañón Vidaurri, a Monterrey trucking owner nicknamed
    El Cartógrafo for the route maps he kept, put his fleet and a customs
    contact in Nuevo Laredo at the service of a new northeastern network.
  participants:
  - {id: p-castanon-a, role: reported-participant}
  - {id: p-elizondo-f, role: reported-participant}
  - {id: p-vidaurri-m, role: reported-participant}
  - {id: org-03, role: organization}
  - {id: co-08, role: company}
- id: beat-04
  type: Founding
  name: Founding of Liga del Cedro Lunar
  date: '2010-11-18'
  place: guadalajara
  organization: org-05
  corridor: cor-tierra-caliente
  description: >-
    Everardo Montemayor Ruvalcaba, a veterinarian who ran a feed business,
    financed the first synthetic laboratories in the Tierra Caliente and
    recruited chemists through Octavio Galván Soto.
  participants:
  - {id: p-montemayor-e, role: reported-participant}
  - {id: p-galvan-o, role: reported-participant}
  - {id: p-ruvalcaba-r, role: reported-participant}
  - {id: org-05, role: organization}
- id: beat-05
  type: Founding
  name: Founding of Pacto del Faro Gris
  date: '2011-01-22'
  place: veracruz
  organization: org-02
  corridor: cor-veracruz-port
  description: >-
    A pact among three Gulf port crews formed under Ignacio Treviño Salcido, called
    El Faro, that pooled dock access in Veracruz, Tuxpan and Tampico and split
    the Highway 180 trucking lanes among them.
  participants:
  - {id: p-trevino-i, role: reported-participant}
  - {id: p-mijares-l, role: reported-participant}
  - {id: p-sarabia-b, role: reported-participant}
  - {id: p-barcenas-u, role: reported-participant}
  - {id: org-02, role: organization}
- id: beat-06
  type: Killing
  name: Killing of Hilario Zepeda
  date: '2012-07-09'
  place: lazaro-cardenas
  organization: org-05
  corridor: cor-lazaro-port
  description: >-
    Gunmen loyal to Liga del Cedro Lunar killed Hilario Zepeda Montaño, the
    Bruma del Cobre plaza boss at the Lázaro Cárdenas docks, and installed
    Heriberto Aranda Nieto in his place within the week.
  participants:
  - {id: p-zepeda-h, role: victim}
  - {id: p-ledezma-c, role: reported-participant}
  - {id: p-aranda-h, role: reported-participant}
  - {id: org-05, role: organization}
  - {id: org-01, role: counterparty}
- id: beat-07
  type: Alliance
  name: Reynosa pact of 2012
  date: '2012-10-03'
  place: reynosa
  organization: org-02
  corridor: cor-reynosa
  description: >-
    Ignacio Treviño Salcido and Aurelio Castañón Vidaurri met in Reynosa and
    agreed to share the Reynosa and Piedras Negras crossings, with Joel Pedraza
    Villaseñor running the Reynosa plaza for both groups.
  participants:
  - {id: p-trevino-i, role: reported-participant}
  - {id: p-castanon-a, role: reported-participant}
  - {id: p-pedraza-j, role: reported-participant}
  - {id: org-02, role: organization}
  - {id: org-03, role: counterparty}
- id: beat-08
  type: Alliance
  name: Hermosillo accord of 2013
  date: '2013-06-11'
  place: hermosillo
  organization: org-01
  corridor: cor-nogales
  description: >-
    Rogelio Anzures Tapia and Gonzalo Ferreira Luján agreed in Hermosillo
    that Bruma del Cobre would run the Nogales crossing and the Highway 15
    route in exchange for a share of every load crossing at San Luis Río
    Colorado and Mexicali.
  participants:
  - {id: p-anzures-r, role: reported-participant}
  - {id: p-ferreira-g, role: reported-participant}
  - {id: p-cervera-n, role: reported-participant}
  - {id: org-01, role: organization}
  - {id: org-04, role: counterparty}
- id: beat-09
  type: Election
  name: Reynosa municipal election of 2013
  date: '2013-07-07'
  place: reynosa
  organization: org-03
  corridor: cor-reynosa
  description: >-
    Esteban Villalpando Ruelas won the Reynosa mayoralty with campaign money
    routed through Seminuevos del Bravo, and the municipal police stopped
    patrolling the river crossings used by the Círculo.
  participants:
  - {id: p-villalpando-e, role: incoming-official}
  - {id: p-cantu-e, role: reported-participant}
  - {id: org-03, role: organization}
  - {id: co-09, role: company}
- id: beat-10
  type: Alliance
  name: Puebla accord of 2014
  date: '2014-02-14'
  place: puebla
  organization: org-05
  corridor: cor-highway-57
  description: >-
    Everardo Montemayor Ruvalcaba and Lorena Mijares Ocampo agreed in Puebla
    that Liga del Cedro Lunar could move methamphetamine along the Highway 180
    route to Tampico in exchange for laboratory chemicals landed at Veracruz.
  participants:
  - {id: p-montemayor-e, role: reported-participant}
  - {id: p-mijares-l, role: reported-participant}
  - {id: org-05, role: organization}
  - {id: org-02, role: counterparty}
- id: beat-11
  type: Arrest
  name: Operation Marea Baja
  date: '2014-08-02'
  place: manzanillo
  organization: org-01
  corridor: cor-manzanillo-port
  description: >-
    Mexican federal forces arrested Rogelio Anzures Tapia at a Manzanillo
    marina in Operation Marea Baja, seizing the fishing vessel Estrella Pardo.
    Damián Olivares Rendón took over the network the same week.
  participants:
  - {id: p-anzures-r, role: arrested}
  - {id: p-olivares-d, role: reported-participant}
  - {id: org-01, role: organization}
  - {id: as-01, role: asset}
- id: beat-12
  type: Arrest
  name: Operation Rompiente
  date: '2014-11-20'
  place: ensenada
  organization: org-04
  corridor: cor-ensenada-maritime
  description: >-
    Gonzalo Ferreira Luján was arrested aboard a panga off Ensenada in
    Operation Rompiente after a marine patrol tracked Panga Coral Tres from
    San Diego. Teodoro Lizárraga Fonseca assumed control of the network.
  participants:
  - {id: p-ferreira-g, role: arrested}
  - {id: p-lizarraga-t, role: reported-participant}
  - {id: org-04, role: organization}
  - {id: as-06, role: asset}
- id: beat-13
  type: Extradition
  name: Extradition of Gonzalo Ferreira
  date: '2015-02-05'
  place: tijuana
  organization: org-04
  description: >-
    Gonzalo Ferreira Luján was extradited through Tijuana to face charges in
    San Diego. His lawyer Alma Urquidi Serrano contested the transfer.
  participants:
  - {id: p-ferreira-g, role: extradited}
  - {id: p-urquidi-a, role: reported-participant}
  - {id: org-04, role: organization}
- id: beat-14
  type: AllianceBreak
  name: Collapse of the Reynosa pact
  date: '2015-07-14'
  place: reynosa
  organization: org-03
  corridor: cor-reynosa
  description: >-
    Círculo del Valle Quieto took sole control of the Reynosa plaza after
    Joel Pedraza Villaseñor refused to pass Pacto del Faro Gris loads, ending the 2012
    pact with Pacto del Faro Gris.
  participants:
  - {id: p-pedraza-j, role: reported-participant}
  - {id: p-castanon-a, role: reported-participant}
  - {id: org-03, role: organization}
  - {id: org-02, role: counterparty}
- id: beat-15
  type: Killing
  name: Killing of Ignacio Treviño
  date: '2016-03-09'
  place: veracruz
  organization: org-02
  corridor: cor-veracruz-port
  description: >-
    Ignacio Treviño Salcido was shot outside a Veracruz restaurant. Reporting
    attributed the killing to a Círculo del Valle Quieto crew. Lorena Mijares
    Ocampo succeeded him and the docks began calling her El Faro.
  participants:
  - {id: p-trevino-i, role: victim}
  - {id: p-mijares-l, role: reported-participant}
  - {id: p-saucedo-l, role: reported-participant}
  - {id: org-02, role: organization}
  - {id: org-03, role: counterparty}
- id: beat-16
  type: AllianceBreak
  name: Collapse of the Puebla accord
  date: '2016-04-20'
  place: veracruz
  organization: org-02
  corridor: cor-gulf-180
  description: >-
    Lorena Mijares Ocampo ended the Puebla accord and expelled Liga del Cedro
    Lunar couriers from the Highway 180 route, blaming the Liga for failing to
    protect Ignacio Treviño Salcido.
  participants:
  - {id: p-mijares-l, role: reported-participant}
  - {id: p-ruvalcaba-r, role: reported-participant}
  - {id: org-02, role: organization}
  - {id: org-05, role: counterparty}
- id: beat-17
  type: Extradition
  name: Extradition of Rogelio Anzures
  date: '2016-05-19'
  place: mexico-city
  organization: org-01
  description: >-
    Rogelio Anzures Tapia was flown from Mexico City to face trafficking
    charges in Phoenix. Carolina Medrano Siller continued to manage his assets
    through Transportes Cerro Pardo.
  participants:
  - {id: p-anzures-r, role: extradited}
  - {id: p-medrano-c, role: reported-participant}
  - {id: org-01, role: organization}
  - {id: co-01, role: company}
- id: beat-18
  type: Seizure
  name: Operation Cauce Seco
  date: '2016-12-02'
