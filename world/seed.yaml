  name: Defection of Fermín Loera
  date: '2017-02-20'
  place: lazaro-cardenas
  organization: org-01
  corridor: cor-lazaro-port
  description: >-
    Fermín Loera Arriaga, called El Relojero, left Bruma del Cobre with his
    Lázaro Cárdenas crew after Damián Olivares Rendón refused to contest the
    port, and joined Liga del Cedro Lunar.
  participants:
  - {id: p-loera-f, role: departing-leader}
  - {id: p-olivares-d, role: reported-participant}
