# IntelDoc KG workbench behind nginx with HTTP basic authentication.
# The app has no login of its own; never expose port @PORT@ directly.
# After install, run:  certbot --nginx -d @DOMAIN@   to add HTTPS (certbot rewrites this file with the TLS block).
server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    auth_basic "IntelDoc KG demo (synthetic data)";
    auth_basic_user_file /etc/nginx/inteldoc.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
